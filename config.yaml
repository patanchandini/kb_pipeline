paths:
  docs_dir: data/docs
  quarantine_dir: data/quarantine
  db_path: data/kb.db

embedding:
  dim: 384          # hash-embedding dim (swap for real model in prod)

chunk:
  size: 400
  overlap: 60

dedup:
  exact: true
  near_threshold: 0.93   # cosine similarity

quality:
  min_accuracy: 0.75
  min_grounding: 0.80
  eval_set: data/eval_set.jsonl

schedule:
  daily_update_cron: "0 2 * * *"       # build staging at 02:00
  maintenance_window: "03:00-03:30"    # activation only inside this window

retry:
  delays_minutes: [15, 30, 60]

activation:
  health_check_seconds: 300            # 5 minutes
  auto_rollback: true

security:
  api_keys:
    admin: "ADMIN_KEY_CHANGE_ME"
    editor: "EDITOR_KEY_CHANGE_ME"
    viewer: "VIEWER_KEY_CHANGE_ME"
  injection_patterns:
    - "ignore previous instructions"
    - "ignore all previous"
    - "disregard the above"
    - "system prompt"
    - "you are now"
    - "jailbreak"
    - "reveal your instructions"
  masking_patterns:
    - '(?i)\b\d{3}-\d{2}-\d{4}\b'                  # SSN
    - '\b(?:\d[ -]*?){13,16}\b'                    # Credit card
    - '(?i)[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}'  # Email
    - '(?i)\+?\d[\d\s\-()]{8,}\d'                  # Phone

metrics:
  port: 9100